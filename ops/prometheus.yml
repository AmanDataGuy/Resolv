# ops/prometheus.yml - Prometheus config for the local ops stack (ops/docker-compose.yml).
# Scrapes the Resolv API's GET /metrics on the compose network and loads the alert rules in alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: resolv-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

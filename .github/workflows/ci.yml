# CI: lint + keyless tests on every push and pull request.
#
# No secrets: the suite exercises the deterministic harness, the eval math and recorded
# trajectories only. LLM-quality tests (tests/llm/) skip themselves without a provider key.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESOLV_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q -p no:cacheprovider
      # Keyless: the nightly gate's false-positive rate, resampled from the reference rows (no model calls).
      # Point it at evals/baselines/agent_ref_gpt_oss_120b.json once the full sweep is pinned.
      - name: Eval gate false-positive rate
        run: python -m evals.gate --baseline evals/results/ref_gpt_oss_120b.jsonl --subset 8 --runs 2 --draws 1000

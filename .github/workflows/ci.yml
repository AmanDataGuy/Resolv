# CI — lint + test on every push and pull request.
#
# No secrets are needed: the LLM agents (extractor + agent loop) are never exercised by the
# suite — only the deterministic harness (policy, tools, validity, routing) and the eval math,
# which run with no API key. That's the point of keeping enforcement out of the model.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

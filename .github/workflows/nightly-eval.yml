# Scheduled, model-gated evals. Costs real API calls, so it runs only when GROQ_API_KEY is set;
# without it every job shows as SKIPPED (not green). Gates compare against same-model reference
# baselines in evals/baselines/; until those are created they skip too.
#   nightly: extractor regression + 8-task agent smoke   weekly: the full 40-task sweep
# Exit codes from the gates: 0 pass, 1 regression, 78 inconclusive (reported, not failed).
name: Scheduled eval

on:
  schedule:
    - cron: "0 6 * * *"     # nightly 06:00 UTC
    - cron: "0 7 * * 0"     # weekly, Sunday 07:00 UTC
  workflow_dispatch: {}

env:
  RESOLV_ENV: eval
  LLM_PROVIDER: groq
  AGENT_MODEL: groq/openai/gpt-oss-120b
  EXTRACTOR_MODEL: groq/openai/gpt-oss-120b
  SIMULATOR_MODEL: groq/openai/gpt-oss-120b
  NIGHTLY_USD_CAP: "0.50"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        run: echo "has_key=${{ secrets.GROQ_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  nightly:
    needs: check
    if: needs.check.outputs.has_key == 'true' && github.event.schedule != '0 7 * * 0'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-eval.txt
      - name: Extractor regression gate
        if: hashFiles('evals/baselines/extractor_ref_groq.json') != ''
        run: python -m evals.extractor --baseline evals/baselines/extractor_ref_groq.json
      - name: Agent smoke gate
        if: hashFiles('evals/baselines/agent_ref_groq.json') != ''
        run: |
          set +e
          python -m evals.runner --subset 8 --n 2 --k 1 --out nightly.jsonl \
            --gate evals/baselines/agent_ref_groq.json
          code=$?
          if [ "$code" = "78" ]; then echo "::warning::gate inconclusive"; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: evals/results/nightly*
          if-no-files-found: ignore

  weekly:
    needs: check
    if: needs.check.outputs.has_key == 'true' && (github.event.schedule == '0 7 * * 0' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-eval.txt
      - name: Full sweep (cost-capped, non-blocking)
        continue-on-error: true
        run: python -m evals.runner --tasks 40 --n 5 --out weekly.jsonl --usd-cap "$NIGHTLY_USD_CAP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-results
          path: evals/results/weekly*
          if-no-files-found: ignore
